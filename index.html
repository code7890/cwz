<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeWithZee - Learn Tech, Build Mindset, Find Direction</title>
    <meta
      name="description"
      content="A desi-first platform to learn coding, freelancing, AI, and startup skills. Practical guidance for real youth."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Make favicon appear circular */
      link[rel="icon"] {
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <!-- Hidden Netlify Forms detection for React SPA -->
    <form name="consultation" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="consultation" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="service" />
      <textarea name="details"></textarea>
    </form>

    <form name="hire-consultation" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="hire-consultation" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="serviceCategory" />
      <textarea name="project"></textarea>
      <input type="text" name="timeline" />
      <input type="text" name="budget" />
    </form>

    <form name="business-setup" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="business-setup" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="package" />
      <textarea name="notes"></textarea>
    </form>

    <form name="newsletter" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="newsletter" />
      <input type="email" name="email" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
